<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="KAJ ERP — نظام ثنائي اللغة لإدارة تجارة السيارات والمخزون والمالية والصيانة.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KAJ ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>KAJ ERP</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:'Noto Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#12393A,#000 62%);color:#fff;z-index:9999;transition:opacity .35s ease}
    .boot-card{text-align:center;padding:34px 42px;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);box-shadow:0 28px 80px rgba(0,0,0,.35)}
    .brand-logo{width:min(260px,68vw);height:auto;max-height:150px;object-fit:contain;border-radius:14px;background:#000;padding:8px;box-sizing:border-box}
    .loader{width:180px;height:3px;margin:24px auto 0;overflow:hidden;border-radius:4px;background:rgba(255,255,255,.15)}
    .loader:after{content:"";display:block;width:42%;height:100%;background:#62bec1;animation:load 1.2s infinite ease-in-out}
    @keyframes load{from{transform:translateX(-130%)}to{transform:translateX(340%)}}
    @media (prefers-reduced-motion:reduce){#boot{transition:none}.loader:after{animation:none;width:100%}}
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite" aria-label="جارٍ تحميل نظام خط الجودة">
    <div class="boot-card">
      <img class="brand-logo" src="assets/assets/images/logo.png" alt="خط الجودة" onerror="this.style.display='none'">
      <h2>KAJ ERP</h2>
      <div>جارٍ تحميل نظام خط الجودة KAJ • Loading KAJ workspace</div>
      <div class="loader" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    (() => {
      const FALLBACK_BUILD = '22.9.8+229008-r73-current-schema-runtime-20260815';
      // Historical R49 audit token retained only for compatibility checks:
      // 22.9.8+229008-r49-focused-final-completion-20260810
      // Legacy audit: FALLBACK_BUILD = '18.9.8+189800-v738-full-verified-runtime-accounting-ui-20260806'
      const VERSION_KEY = 'kaj-runtime-build';
      const RELOAD_KEY = 'kaj-version-reload';
      const boot = document.getElementById('boot');
      let removed = false;

      function removeBoot() {
        if (removed || !boot) return;
        removed = true;
        boot.style.opacity = '0';
        boot.style.pointerEvents = 'none';
        setTimeout(() => boot.remove(), 360);
      }

      function showBootError(message) {
        if (!boot || removed) return;
        boot.querySelector('.boot-card').innerHTML = `<h2>تعذر بدء التطبيق</h2><p>${message}</p><button onclick="location.reload()" style="margin-top:14px;padding:11px 22px;border:0;border-radius:12px;font-weight:700;cursor:pointer">إعادة المحاولة</button>`;
      }

      async function deployedBuild() {
        try {
          const response = await fetch(`version.json?t=${Date.now()}`, {cache:'no-store'});
          if (!response.ok) return FALLBACK_BUILD;
          const data = await response.json();
          if (!data.version || !(data.buildNumber || data.build)) {
            return FALLBACK_BUILD;
          }
          const baseBuild = `${data.version}+${data.buildNumber || data.build}`;
          const runtimeToken = data.runtimeToken || data.releaseToken;
          return runtimeToken ? `${baseBuild}-${runtimeToken}` : baseBuild;
        } catch (_) { return FALLBACK_BUILD; }
      }

      async function clearObsoleteRuntime(build) {
        const stored = localStorage.getItem(VERSION_KEY);
        // Always remove obsolete Flutter service workers and CacheStorage.
        // A device may have installed them before version.json existed, so a
        // version comparison alone is not sufficient to recover its UI.
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
        localStorage.setItem(VERSION_KEY, build);
        return stored !== null && stored !== build;
      }

      async function start() {
        try {
          const build = await deployedBuild();
          window.__KAJ_BUILD__ = build;
          const changed = await clearObsoleteRuntime(build);
          if (changed && sessionStorage.getItem(RELOAD_KEY) !== build) {
            sessionStorage.setItem(RELOAD_KEY, build);
            location.replace(`${location.pathname}?v=${encodeURIComponent(build)}${location.hash}`);
            return;
          }
          sessionStorage.removeItem(RELOAD_KEY);
          const script = document.createElement('script');
          script.src = `flutter_bootstrap.js?v=${encodeURIComponent(build)}`;
          script.defer = true;
          script.onerror = () => showBootError('تعذر تحميل ملفات البرنامج. تأكد من رفع مجلد build/web بالكامل.');
          document.body.appendChild(script);
        } catch (error) {
          console.warn('KAJ startup recovery:', error);
          showBootError('تعذر تهيئة النسخة الحالية. أعد المحاولة بعد التحقق من الاتصال.');
        }
      }

      window.addEventListener('flutter-first-frame', removeBoot, {once:true});
      document.addEventListener('flutter-first-frame', removeBoot, {once:true});
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!removed) {
            showBootError('استغرق تشغيل التطبيق وقتًا أطول من المتوقع. افتح أدوات المطور وراجع Console ثم أعد المحاولة.');
          }
        }, 30000);
      }, {once:true});
      window.addEventListener('online', () => console.info('KAJ ERP connectivity restored.'));
      window.addEventListener('offline', () => console.warn('KAJ ERP is offline; cloud operations are unavailable.'));
      start();
    })();
  </script>
</body>
</html>
