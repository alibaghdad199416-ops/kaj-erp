name: Phase 4 unified query cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python tool/phase4_unified_query_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/accounting/pages/accounting_page.dart lib/features/inventory/pages/inventory_page.dart lib/features/inventory/controllers/inventory_controller.dart
          git add -u .github/workflows/phase4_unified_query_cleanup.yml tool/phase4_unified_query_cleanup.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor(phase4): complete accounting and inventory unified query UI cleanup'
          git push origin HEAD:main
