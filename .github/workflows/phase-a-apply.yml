name: Phase A source migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -B tool/phase_a_apply.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tool/phase_a_apply.py .github/workflows/phase-a-apply.yml .github/workflows/_phase_a_apply.yml || true
          git add lib
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(phaseA): remove duplicated module chrome'
          git push origin HEAD:main
