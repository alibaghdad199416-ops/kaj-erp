name: final-cross-stage-static-audit

on:
  push:
    branches:
      - final-cross-stage-integrity-audit-2026-08-26

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run final cross-stage static audit
        run: python -B tool/verify_final_cross_stage_integrity.py
      - name: Remove one-shot audit workflow after a successful pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-cross-stage-static-audit.yml
          git add .github/workflows/final-cross-stage-static-audit.yml
          git commit -m "test: complete one-shot final cross-stage static audit" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
