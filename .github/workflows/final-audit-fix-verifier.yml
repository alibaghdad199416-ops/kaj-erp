name: final-audit-fix-verifier

on:
  push:
    branches:
      - final-cross-stage-integrity-audit-2026-08-26

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize search_path assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path('tool/verify_final_cross_stage_integrity.py')
          text = p.read_text(encoding='utf-8')
          old = "need('set search_path=' in snippet.lower(), f'SECURITY DEFINER function without pinned search_path in {sql.name}')"
          new = "need(re.search(r'set\\s+search_path\\s*=', snippet, re.IGNORECASE) is not None, f'SECURITY DEFINER function without pinned search_path in {sql.name}')"
          if old not in text:
              raise SystemExit('expected assertion not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-audit-fix-verifier.yml
          git add tool/verify_final_cross_stage_integrity.py .github/workflows/final-audit-fix-verifier.yml
          git commit -m "fix: accept normalized SECURITY DEFINER search_path syntax"
          git push origin "HEAD:${GITHUB_REF_NAME}"
