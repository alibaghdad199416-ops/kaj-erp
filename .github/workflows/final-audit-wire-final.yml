name: final-audit-wire-final

on:
  push:
    branches:
      - final-cross-stage-integrity-audit-2026-08-26

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire stage closure verifiers into verify:final
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          scripts = data['scripts']
          value = scripts['verify:final']
          for command in ('npm run verify:stage11', 'npm run verify:stage12', 'npm run verify:stage12:storage'):
              if command not in value:
                  value += ' && ' + command
          scripts['verify:final'] = value
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-audit-wire-final.yml
          git add package.json .github/workflows/final-audit-wire-final.yml
          git commit -m "fix: include stage 11 and 12 closures in verify:final"
          git push origin "HEAD:${GITHUB_REF_NAME}"
