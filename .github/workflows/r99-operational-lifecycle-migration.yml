name: R99 operational lifecycle migration

on:
  push:
    branches:
      - current-local-r92-20260820
    paths:
      - .github/workflows/r99-operational-lifecycle-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: current-local-r92-20260820
          fetch-depth: 0

      - name: Migrate operational lifecycle consumers
        shell: bash
        run: |
          set -euo pipefail
          branch='current-local-r92-20260820'
          git fetch origin "$branch"
          git checkout "$branch"
          git pull --ff-only origin "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/sales/workflow/pages/order_details_dialog.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'package:quality_line_erp/core/operations/operational_lifecycle_table.dart';\n"
          anchor = "import 'package:quality_line_erp/core/logging/app_logger.dart';\n"
          assert import_line not in text, 'commercial lifecycle import already present'
          assert anchor in text, 'commercial import anchor changed'
          text = text.replace(anchor, anchor + import_line, 1)

          start = '  Widget _itemLifecycleTable(Map<String, Object?> order) {'
          end = '  Widget _warehouseDocumentsTable(Map<String, Object?> order) {'
          assert text.count(start) == 1, 'commercial lifecycle method changed'
          assert text.count(end) == 1, 'commercial warehouse method marker changed'
          before, tail = text.split(start, 1)
          _, after = tail.split(end, 1)
          replacement = r'''  Widget _itemLifecycleTable(Map<String, Object?> _) {
            final lifecycleRows = _items.map((item) {
              final itemId = _firstValue(item, const [
                'id',
                'itemId',
                'productId',
                'carId',
              ]);
              final reconciliation = _reconciliationFor(itemId);
              return <String, Object?>{
                ...item,
                if (reconciliation != null) ...reconciliation,
                'lineId': itemId,
                'itemId': itemId,
                'description': _itemDescription(item, null),
                'displayLabel': _itemLabel(item, null),
              };
            }).toList(growable: false);

            return Card(
              clipBehavior: Clip.antiAlias,
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.stretch,
                children: <Widget>[
                  Padding(
                    padding: const EdgeInsets.fromLTRB(16, 14, 16, 8),
                    child: AppText(
                      _bi(
                        'دورة البنود: المطلوب ← الحركة المخزنية ← المفوتر',
                        'Item lifecycle: Requested → Logistics → Invoiced',
                      ),
                      style: Theme.of(context).textTheme.titleMedium?.copyWith(
                        fontWeight: FontWeight.w800,
                      ),
                    ),
                  ),
                  OperationalLifecycleTable(
                    rows: lifecycleRows,
                    itemLabel: _bi('المادة / المنتج', 'Item / Product'),
                    descriptionLabel: _bi('الوصف', 'Description'),
                    requestedLabel: _bi('المطلوب', 'Requested'),
                    logisticsLabel: _bi(
                      widget.purchase ? 'المستلم' : 'المجهز',
                      widget.purchase ? 'Receipt' : 'Delivery',
                    ),
                    invoicedLabel: _bi('المفوتر', 'Invoiced'),
                    remainingLogisticsLabel: _bi(
                      'المتبقي لوجستيًا',
                      'Remaining logistics',
                    ),
                    remainingInvoiceLabel: _bi(
                      'المتبقي للفوترة',
                      'Remaining invoice',
                    ),
                    emptyLabel: _bi(
                      'لا توجد بنود في الأمر.',
                      'No order items.',
                    ),
                    itemTextBuilder: (line) =>
                        line.raw['displayLabel']?.toString() ??
                        (line.itemId.isEmpty ? '-' : line.itemId),
                    descriptionTextBuilder: (line) =>
                        line.description.isEmpty ? '-' : line.description,
                    quantityFormatter: (value) => _money.format(value),
                  ),
                ],
              ),
            );
          }

          '''
          path.write_text(before + replacement + end + after, encoding='utf-8')
          PY

          git diff --check -- lib/features/sales/workflow/pages/order_details_dialog.dart
          git add -- lib/features/sales/workflow/pages/order_details_dialog.dart
          git diff --cached --check
          git commit -m 'refactor(sales): use shared operational lifecycle table'
          git push origin HEAD:"$branch"

          git pull --ff-only origin "$branch"

          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/maintenance/pages/maintenance_order_details_dialog.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'package:quality_line_erp/core/operations/operational_lifecycle_table.dart';\n"
          anchor = "import 'package:quality_line_erp/core/localization/app_localizations.dart';\n"
          assert import_line not in text, 'maintenance lifecycle import already present'
          assert anchor in text, 'maintenance import anchor changed'
          text = text.replace(anchor, anchor + import_line, 1)

          helper_start = '  Map<String, Object?>? _reconciliationLine(String lineId) {'
          init_marker = '  @override\n  void initState() {'
          assert text.count(helper_start) == 1, 'maintenance reconciliation helper changed'
          assert text.count(init_marker) == 1, 'maintenance init marker changed'
          before, tail = text.split(helper_start, 1)
          _, after = tail.split(init_marker, 1)
          text = before + init_marker + after

          start = '  Widget _maintenanceLinesTable(MaintenanceOrderModel order) {'
          end = '  Widget _summary(MaintenanceOrderModel order) => Card('
          assert text.count(start) == 1, 'maintenance lifecycle table changed'
          assert text.count(end) == 1, 'maintenance summary marker changed'
          before, tail = text.split(start, 1)
          _, after = tail.split(end, 1)
          replacement = r'''  Widget _maintenanceLinesTable(MaintenanceOrderModel _) {
            final reconciliationByLine = <String, Map<String, Object?>>{};
            for (final row in _costs?.lines ?? const <Map<String, Object?>>[]) {
              final lineId = row['lineId']?.toString().trim() ?? '';
              if (lineId.isNotEmpty) reconciliationByLine[lineId] = row;
            }
            final lifecycleRows = _lines.map((line) {
              final reconciliation = reconciliationByLine[line.id];
              return <String, Object?>{
                if (reconciliation != null) ...reconciliation,
                'lineId': line.id,
                'itemId': line.productId,
                'productName': line.productName,
                'description': line.description.trim().isNotEmpty
                    ? line.description.trim()
                    : line.productName,
                'requestedQuantity': line.quantity,
                'lineType': line.lineType,
              };
            }).toList(growable: false);

            return Card(
              clipBehavior: Clip.antiAlias,
              child: OperationalLifecycleTable(
                rows: lifecycleRows,
                itemLabel: _bi('المادة / الخدمة', 'Item / Service'),
                descriptionLabel: _bi('الوصف', 'Description'),
                requestedLabel: _bi('المطلوب', 'Requested'),
                logisticsLabel: _bi('المصروف', 'Issue'),
                invoicedLabel: _bi('المفوتر', 'Invoiced'),
                remainingLogisticsLabel: _bi(
                  'المتبقي للصرف',
                  'Remaining logistics',
                ),
                remainingInvoiceLabel: _bi(
                  'المتبقي للفوترة',
                  'Remaining invoice',
                ),
                emptyLabel: _bi(
                  'لا توجد بنود في هذا الأمر.',
                  'No items in this order.',
                ),
                itemTextBuilder: (line) =>
                    line.raw['productName']?.toString() ??
                    (line.itemId.isEmpty ? '-' : line.itemId),
                descriptionTextBuilder: (line) =>
                    line.description.isEmpty ? '-' : line.description,
              ),
            );
          }

          '''
          path.write_text(before + replacement + end + after, encoding='utf-8')
          PY

          rm -- .github/workflows/r99-operational-lifecycle-migration.yml
          git diff --check -- lib/features/maintenance/pages/maintenance_order_details_dialog.dart
          git add -- lib/features/maintenance/pages/maintenance_order_details_dialog.dart .github/workflows/r99-operational-lifecycle-migration.yml
          git diff --cached --check
          git commit -m 'refactor(maintenance): use shared operational lifecycle table'
          git push origin HEAD:"$branch"
