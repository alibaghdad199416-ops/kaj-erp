name: Phase 3 Source Repair

on:
  push:
    branches:
      - stage2-database-verification

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inventory repository syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/inventory/data/inventory_repository.dart')
          text = p.read_text(encoding='utf-8')
          old = "'warehouseId': ?normalizedWarehouseId,"
          new = "'warehouseId': normalizedWarehouseId,"
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit repair when needed
        shell: bash
        run: |
          if git diff --quiet -- lib/features/inventory/data/inventory_repository.dart; then
            echo 'No source repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/inventory/data/inventory_repository.dart
          git commit -m 'fix(phase3): repair inventory repository syntax'
          git push
