name: R101 focused run probe

on:
  push:
    branches:
      - current-local-r92-20260820
    paths:
      - .github/workflows/r101-run-probe.yml

permissions:
  contents: write
  actions: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: current-local-r92-20260820
          fetch-depth: 0
      - name: Record latest focused run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='current-local-r92-20260820'
          proof='.github/r101-focused-run-probe.txt'
          workflow='.github/workflows/r101-run-probe.yml'
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/r101-focused-runtime-closure.yml/runs?branch=${branch}&event=push&per_page=5" \
            > /tmp/runs.json
          python - <<'PY' > "$proof"
          import json
          from pathlib import Path
          runs = json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8')).get('workflow_runs') or []
          print('R101 focused workflow probe')
          if not runs:
              print('found=false')
          else:
              run = runs[0]
              for key in ('id', 'status', 'conclusion', 'head_sha', 'event', 'run_number'):
                  print(f"{key}={run.get(key)}")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin "$branch"
          git rm -- "$workflow"
          git add -- "$proof"
          git diff --cached --check
          git commit -m 'chore(ci): record focused R101 run state'
          git push origin HEAD:"$branch"
