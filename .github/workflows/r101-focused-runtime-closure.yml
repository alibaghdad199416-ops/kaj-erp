name: R99-R101 focused runtime closure

on:
  push:
    branches:
      - current-local-r92-20260820
    paths:
      - .github/workflows/r101-focused-runtime-closure.yml

permissions:
  contents: write

jobs:
  verify-and-close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: current-local-r92-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply deterministic GL presentation fix in verification workspace
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('lib/features/accounting/pages/accounting_center_page.dart')
          source = page.read_text(encoding='utf-8')
          old = """                      final accountRows = account.value
                        ..sort((left, right) {
                          final leftDate = '${left['entryDate'] ?? ''}';
                          final rightDate = '${right['entryDate'] ?? ''}';
                          final dateResult = leftDate.compareTo(rightDate);
                          if (dateResult != 0) return dateResult;
                          return '${left['entryNumber'] ?? ''}'.compareTo(
                            '${right['entryNumber'] ?? ''}',
                          );
                        });
"""
          new = """                      final accountRows = List<Map<String, Object?>>.of(
                        account.value,
                      );
                      // R101 makes General Ledger running balances deterministic
                      // at the database boundary. Preserve that exact server row
                      // order so tied lines from the same journal entry cannot be
                      // reordered after their running balances are calculated.
                      if (widget.type != _AccountingReportType.generalLedger) {
                        accountRows.sort((left, right) {
                          final leftDate = '${left['entryDate'] ?? ''}';
                          final rightDate = '${right['entryDate'] ?? ''}';
                          final dateResult = leftDate.compareTo(rightDate);
                          if (dateResult != 0) return dateResult;
                          return '${left['entryNumber'] ?? ''}'.compareTo(
                            '${right['entryNumber'] ?? ''}',
                          );
                        });
                      }
"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one legacy GL sort block, found {source.count(old)}')
          page.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install Node tooling without package lifecycle gates
        id: npmci
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Resolve Flutter packages
        id: pubget
        continue-on-error: true
        run: flutter pub get

      - name: Format GL presentation fix
        id: format
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib/features/accounting/pages/accounting_center_page.dart

      - name: Verify R100/R101 static accounting projection contract
        id: staticproof
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -B tool/verify_r100_r101_accounting_projection.py 2>&1 | tee /tmp/r100-r101-static.log

      - name: Analyze current Flutter application
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee /tmp/r101-analyze.log

      - name: Start LOCAL Supabase
        id: supabase
        continue-on-error: true
        run: npx supabase start

      - name: Run canonical LOCAL PostgreSQL runtime gates through R101
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -B tool/run_r89_r92_local_runtime_tests.py 2>&1 | tee /tmp/r89-r101-runtime.log

      - name: Stop LOCAL Supabase
        if: always()
        continue-on-error: true
        run: npx supabase stop --no-backup

      - name: Record proof and publish only when every focused gate passes
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outcome }}
          NPMCI: ${{ steps.npmci.outcome }}
          PUBGET: ${{ steps.pubget.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          STATICPROOF: ${{ steps.staticproof.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          SUPABASE: ${{ steps.supabase.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          branch='current-local-r92-20260820'
          proof='.github/r101-focused-runtime-closure.txt'
          workflow='.github/workflows/r101-focused-runtime-closure.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          {
            echo 'R99-R101 focused runtime closure'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "verified_branch=${branch}"
            echo "verification_checkout=$(git rev-parse HEAD)"
            echo "patch=${PATCH}"
            echo "npm_ci=${NPMCI}"
            echo "pub_get=${PUBGET}"
            echo "format=${FORMAT}"
            echo "static_proof=${STATICPROOF}"
            echo "analyze=${ANALYZE}"
            echo "supabase_start=${SUPABASE}"
            echo "canonical_runtime=${RUNTIME}"
            echo
            echo '[focused runtime evidence]'
            grep -E 'verify_r99_sales_invoice_active_stage_runtime.sql|verify_r99_maintenance_invoice_current_workflow_runtime.sql|verify_r100_accounting_report_projection_runtime.sql|verify_r101_gl_running_balance_runtime.sql|R58 \+ R89-R101 LOCAL PostgreSQL runtime verification PASS' /tmp/r89-r101-runtime.log 2>/dev/null || true
            echo
            echo '[static verifier evidence]'
            tail -20 /tmp/r100-r101-static.log 2>/dev/null || true
            echo
            echo '[runtime tail]'
            tail -80 /tmp/r89-r101-runtime.log 2>/dev/null || true
            echo
            echo '[analyzer tail]'
            tail -40 /tmp/r101-analyze.log 2>/dev/null || true
          } > "$proof"

          if [ "$PATCH" = success ] && [ "$NPMCI" = success ] && \
             [ "$PUBGET" = success ] && [ "$FORMAT" = success ] && \
             [ "$STATICPROOF" = success ] && [ "$ANALYZE" = success ] && \
             [ "$SUPABASE" = success ] && [ "$RUNTIME" = success ]; then
            git show e30118be37930f5dd03d479e676b074aaa9fda64:.github/workflows/quality-gates.yml > .github/workflows/quality-gates.yml
            git rm -- "$workflow"
            git add -- \
              lib/features/accounting/pages/accounting_center_page.dart \
              .github/workflows/quality-gates.yml \
              "$proof"
            git diff --cached --check
            git commit -m 'fix(accounting): preserve deterministic GL row order'
          else
            git restore --worktree -- lib/features/accounting/pages/accounting_center_page.dart
            git add -- "$proof"
            git diff --cached --check
            git commit -m 'test(runtime): record R99-R101 closure failure'
          fi

          git pull --rebase --autostash origin "$branch"
          git push origin HEAD:"$branch"
