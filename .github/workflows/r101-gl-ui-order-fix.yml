name: R101 GL UI row-order fix

on:
  push:
    branches:
      - current-local-r92-20260820
    paths:
      - .github/workflows/r101-gl-ui-order-fix.yml
  pull_request:
    paths:
      - .github/workflows/r101-gl-ui-order-fix.yml
      - lib/features/accounting/pages/accounting_center_page.dart
      - test/features/accounting/accounting_trial_balance_projection_test.dart
      - supabase/migrations/20260821193000_r100_accounting_report_projection_closure.sql
      - supabase/migrations/20260821200000_r101_gl_running_balance_deterministic_closure.sql
      - supabase/tests/verify_r100_accounting_report_projection_runtime.sql
      - supabase/tests/verify_r101_gl_running_balance_runtime.sql
      - tool/run_r89_r92_local_runtime_tests.py

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: current-local-r92-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply deterministic GL presentation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('lib/features/accounting/pages/accounting_center_page.dart')
          source = page.read_text(encoding='utf-8')
          old = """                      final accountRows = account.value
                        ..sort((left, right) {
                          final leftDate = '${left['entryDate'] ?? ''}';
                          final rightDate = '${right['entryDate'] ?? ''}';
                          final dateResult = leftDate.compareTo(rightDate);
                          if (dateResult != 0) return dateResult;
                          return '${left['entryNumber'] ?? ''}'.compareTo(
                            '${right['entryNumber'] ?? ''}',
                          );
                        });
"""
          new = """                      final accountRows = List<Map<String, Object?>>.of(
                        account.value,
                      );
                      // R101 makes General Ledger running balances deterministic
                      // at the database boundary. Preserve that exact server row
                      // order so tied lines from the same journal entry cannot be
                      // reordered after their running balances are calculated.
                      if (widget.type != _AccountingReportType.generalLedger) {
                        accountRows.sort((left, right) {
                          final leftDate = '${left['entryDate'] ?? ''}';
                          final rightDate = '${right['entryDate'] ?? ''}';
                          final dateResult = leftDate.compareTo(rightDate);
                          if (dateResult != 0) return dateResult;
                          return '${left['entryNumber'] ?? ''}'.compareTo(
                            '${right['entryNumber'] ?? ''}',
                          );
                        });
                      }
"""
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one legacy accountRows sort block')
          page.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('test/features/accounting/accounting_trial_balance_projection_test.dart')
          test_source = test.read_text(encoding='utf-8')
          marker = "  test('accounting report repository uses the guarded detailed-report RPC', () {"
          addition = """  test('General Ledger preserves deterministic server row order', () {
    final source = File(
      'lib/features/accounting/pages/accounting_center_page.dart',
    ).readAsStringSync();

    expect(
      source,
      contains('final accountRows = List<Map<String, Object?>>.of('),
    );
    expect(
      source,
      contains('if (widget.type != _AccountingReportType.generalLedger) {'),
    );
    expect(
      source,
      contains('R101 makes General Ledger running balances deterministic'),
    );
  });

"""
          if test_source.count(marker) != 1:
              raise SystemExit('Expected accounting report repository test marker')
          test.write_text(test_source.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Install repository tooling
        run: npm ci
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/features/accounting/pages/accounting_center_page.dart test/features/accounting/accounting_trial_balance_projection_test.dart
      - name: Verify accounting presentation regressions
        run: flutter test test/features/accounting/accounting_trial_balance_projection_test.dart
      - name: Analyze current application
        run: npm run analyze
      - name: Start LOCAL Supabase
        run: npx supabase start
      - name: Run canonical LOCAL PostgreSQL runtime gates through R101
        run: python -B tool/run_r89_r92_local_runtime_tests.py
      - name: Stop LOCAL Supabase
        if: always()
        run: npx supabase stop --no-backup
      - name: Publish verified GL presentation fix
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          branch='current-local-r92-20260820'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin "$branch"
          git rm -f --ignore-unmatch -- \
            .github/workflows/r99-sales-maintenance-runtime-verify.yml \
            .github/workflows/r100-accounting-runtime-verify.yml \
            .github/workflows/r101-accounting-runtime-verify.yml \
            .github/workflows/r101-gl-ui-order-fix.yml
          git add -- \
            lib/features/accounting/pages/accounting_center_page.dart \
            test/features/accounting/accounting_trial_balance_projection_test.dart
          git diff --cached --check
          git commit -m 'fix(accounting): preserve deterministic GL row order'
          git push origin HEAD:"$branch"
