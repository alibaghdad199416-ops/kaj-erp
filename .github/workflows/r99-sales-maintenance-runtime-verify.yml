name: R99 sales and maintenance runtime verify

on:
  push:
    branches:
      - current-local-r92-20260820
    paths:
      - .github/workflows/r99-sales-maintenance-runtime-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: current-local-r92-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository tooling
        run: npm ci
      - name: Start LOCAL Supabase
        run: npx supabase start
      - name: Verify Sales and Maintenance invoice runtime gates
        run: python -B tool/run_r89_r92_local_runtime_tests.py
      - name: Stop LOCAL Supabase
        if: always()
        run: npx supabase stop --no-backup
      - name: Record successful runtime verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          branch='current-local-r92-20260820'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin "$branch"
          rm -- .github/workflows/r99-sales-maintenance-runtime-verify.yml
          git add -- .github/workflows/r99-sales-maintenance-runtime-verify.yml
          git diff --cached --check
          git commit -m 'test(invoices): verify sales and maintenance runtime gates'
          git push origin HEAD:"$branch"
