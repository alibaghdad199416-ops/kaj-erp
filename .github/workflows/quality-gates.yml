name: Quality Gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: flutter pub get
      - run: npm run verify:delivery
      - run: python -B tool/verify_supabase_environment_split.py
      - run: python -B tool/verify_r70_crm_runtime.py
      - run: python -B tool/verify_r86_phase2b_sales_readback.py
      - run: npx playwright test playwright-tests/phase2b_sales_workflow_flutter_runtime.spec.ts --list
      - run: npm run format:check
      - run: npm run verify:all
      - run: npm run analyze
      - run: npm run test
      - name: Start LOCAL Supabase
        run: npx supabase start
      - name: Run R89-R93 LOCAL PostgreSQL runtime gates
        run: python -B tool/run_r89_r92_local_runtime_tests.py
      - run: npm run build:web
      - name: Stop LOCAL Supabase
        if: always()
        run: npx supabase stop --no-backup
