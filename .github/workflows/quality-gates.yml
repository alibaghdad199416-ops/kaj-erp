name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -B tool/phase_a_apply.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tool/phase_a_apply.py .github/workflows/phase-a-apply.yml .github/workflows/_phase_a_apply.yml tool/phase_a_trigger.txt
          git add lib
          git commit -m 'refactor(phaseA): remove duplicated module chrome'
          git push origin HEAD:main
      - run: python -B tool/stage2_database_migration_audit.py
      - run: python -B tool/verify_stage3_maintenance_closure.py
      - run: python -B tool/verify_stage3_maintenance_runtime_closure.py
      - run: npm run verify:delivery
      - run: npm ci
      - run: flutter pub get
      - run: npm run format
      - run: npm run verify:all
      - run: npm run format:check
      - run: npm run analyze
      - run: npm run test
      - run: npm run build:web
      - run: npx supabase --version
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase db lint
