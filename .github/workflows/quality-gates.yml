name: Quality Gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase
        run: supabase start
      - name: Reset database from all migrations and seed
        run: supabase db reset --yes
      - name: Phase 2 — Database/Auth/RLS deep gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tool/phase2_database_security_audit.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run verify:delivery
      - run: npm ci
      - run: flutter pub get
      - run: npm run format
      - run: npm run verify:all
      - run: npm run format:check
      - run: npm run analyze
      - run: npm run test
      - run: npm run build:web
