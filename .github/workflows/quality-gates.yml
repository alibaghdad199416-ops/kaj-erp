name: Quality Gates

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run verify:delivery
      - run: python -B tool/verify_supabase_environment_split.py
      - run: python -B tool/verify_r70_crm_runtime.py
      - run: python -B tool/verify_r86_phase2b_sales_readback.py
      - run: npm ci
      - run: npx playwright test playwright-tests/phase2b_sales_workflow_flutter_runtime.spec.ts --list
      - run: flutter pub get
      - run: npm run format
      - run: npm run verify:all
      - run: npm run format:check
      - run: npm run analyze
      - run: npm run test
      - run: npm run build:web
      - name: Build production web artifact with production Supabase defines
        run: flutter build web --release --no-wasm-dry-run --no-web-resources-cdn --dart-define-from-file=dart_defines.production.json
