name: Phase 4 report language repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Unify export language with ReportExportOptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/settings/reports/services/report_export_service.dart')
          s = p.read_text()
          s = s.replace("  // Report artifacts are intentionally English-only. Keep the language behind\n  // a runtime getter so the analyzer does not fold English-only branches into\n  // dead code while the shared renderer remains structurally bilingual.\n  String get _exportLanguage => 'en';\n\n", '')
          s = s.replace('final language = _exportLanguage;', 'final language = options.language;')
          s = s.replace('final l = _exportLanguage;', 'final l = options.language;')
          s = s.replace("_fileName(module, 'en')", '_fileName(module, options.language)')
          p.write_text(s)
          PY
          rm -f .github/workflows/_phase4_report_language_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/settings/reports/services/report_export_service.dart .github/workflows/_phase4_report_language_repair.yml
          git commit -m 'fix(phase4): unify report export language state'
          git push origin HEAD:main
