name: Phase 4 one-time repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply report export state repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/settings/reports/services/report_export_service.dart')
          s = p.read_text()
          old = """  // Report artifacts are intentionally English-only. Keep the language behind
  // a runtime getter so the analyzer does not fold English-only branches into
  // dead code while the shared renderer remains structurally bilingual.
  String get _exportLanguage => 'en';

"""
          s = s.replace(old, '')
          s = s.replace('final language = _exportLanguage;', 'final language = options.language;')
          s = s.replace('final l = _exportLanguage;', 'final l = options.language;')
          s = s.replace("fileName: '${_fileName(module, 'en')}.pdf'", "fileName: '${_fileName(module, options.language)}.pdf'")
          p.write_text(s)
          PY
          rm -f .github/workflows/_phase4_repair_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/settings/reports/services/report_export_service.dart .github/workflows/_phase4_repair_once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(phase4): unify report export language state'
          git push origin HEAD:main
