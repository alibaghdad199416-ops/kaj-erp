# Quality Line ERP / KAJ ERP — local Supabase only.
# This file must never contain a hosted project ref or hosted application URL.
# Production is selected only through dart_defines.production.json.
project_id = "quality_line_erp_local_dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher only; no production SMTP is used during development.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5000"
additional_redirect_urls = ["http://127.0.0.1:**", "http://localhost:**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# ERP users are provisioned by a trusted admin path. The local development user
# is created by tool/bootstrap_local_supabase.ps1 through the local Auth admin API.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development mail must not be a prerequisite for the seeded dev account.
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.third_party.firebase]
enabled = false

[auth.oauth_server]
enabled = false
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# The ERP does not depend on local Logflare/analytics. Keep the development
# stack focused on Postgres, Auth, Storage, Realtime, PostgREST/RPC and Studio.
[analytics]
enabled = false
port = 54327
backend = "postgres"
